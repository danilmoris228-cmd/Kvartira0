<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Квартира 0</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0e1621;
            --header-bg: #17212b;
            --text-color: #e1e3e6;
            --msg-in: #182533;
            --msg-out: #2b5278;
            --accent: #5eb5f7;
            --danger: #ff4d4d;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .header {
            background-color: var(--header-bg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #000;
            z-index: 10;
        }
        .header-title {
            font-weight: bold;
            font-size: 16px;
        }
        .header-subtitle {
            font-size: 12px;
            color: #7f91a4;
        }
        .chat-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-in {
            background-color: var(--msg-in);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .msg-out {
            background-color: var(--msg-out);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg-system {
            background-color: transparent;
            color: #7f91a4;
            text-align: center;
            align-self: center;
            font-size: 12px;
            max-width: 100%;
            padding: 5px;
        }
        .msg-danger {
            color: var(--danger);
            font-weight: bold;
        }
        .sender-name {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 4px;
            font-weight: bold;
        }
        .controls-area {
            background-color: var(--header-bg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid #000;
            min-height: 100px;
            justify-content: center;
        }
        .btn {
            background-color: #2b5278;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .btn:active {
            background-color: #1c3a56;
        }
        .btn-secondary {
            background-color: #232e3c;
            color: var(--text-color);
        }
        .btn-danger {
            background-color: #4a2528;
            color: #ff8a8a;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div>
                <div class="header-title">Подъезд #3 Лесная 12</div>
                <div class="header-subtitle" id="header-status">48 участников</div>
            </div>
        </div>
        
        <div class="chat-area" id="chat">
            <!-- Сюда будут добавляться сообщения -->
        </div>

        <div class="controls-area" id="controls">
            <!-- Сюда будут добавляться кнопки -->
        </div>
    </div>

    <script>
        // Инициализация VK Bridge (заглушка для локального теста)
        if(typeof bridge !== 'undefined') {
            bridge.send("VKWebAppInit");
        }

        const chat = document.getElementById('chat');
        const controls = document.getElementById('controls');
        const headerStatus = document.getElementById('header-status');

        // Функция для добавления сообщения в чат
        function addMessage(sender, text, type = 'in') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message msg-${type}`;
            
            let html = '';
            if (type === 'in' && sender) {
                html += `<div class="sender-name">${sender}</div>`;
            }
            html += `<div>${text}</div>`;
            
            msgDiv.innerHTML = html;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight; // Автоскролл вниз
        }

        // Функция для очистки кнопок
        function clearButtons() {
            controls.innerHTML = '';
        }

        // Функция для добавления кнопки
        function addButton(text, action, styleClass = '') {
            const btn = document.createElement('button');
            btn.className = `btn ${styleClass}`;
            btn.innerText = text;
            btn.onclick = action;
            controls.appendChild(btn);
        }

        // === СЦЕНАРИЙ ИГРЫ ===
        // Мы разобьем игру на шаги, чтобы игрок читал постепенно

        function startGame() {
            clearButtons();
            chat.innerHTML = '';
            headerStatus.innerText = '48 участников';
            
            // Сцена 1. Вступление
            addMessage('', 'Вы держите в руке телефон. На часах 02:58. Вы — Артём, вам 24 года. Вы заехали в съемную квартиру №44 на 9-м этаже 3 дня назад. На экране уведомление: вас добавили в группу.', 'system');
            addButton('Открыть чат', scene2);
        }

        function scene2() {
            clearButtons();
            addMessage('Света, кв. 17', 'Кто опять оставил коляску у лифта?');
            addMessage('Игорь, кв. 30', 'Не моя.');
            addMessage('Нина Ив., кв. 8', 'Воду завтра отключат с 10 до 14.');
            addMessage('', 'В доме 47 квартир. Но в чате почему-то 48 участников. Вам пишет старшая по дому.', 'system');
            addMessage('Валентина Петровна', 'Артём, добро пожаловать! Почитай закреп.');
            addButton('Прочитать закреп', scene3);
        }

        function scene3() {
            clearButtons();
            addMessage('', '<b>Правила подъезда:</b><br>1. Квартире 0 не отвечать.<br>2. Её голосование не поддерживать.<br>3. Если в чате пишут от твоего имени — ничего не удаляй.', 'system');
            addButton('Понятно. Листаю чат дальше', scene4);
        }

        function scene4() {
            clearButtons();
            addMessage('', 'Вы листаете историю чата вверх. В понедельник, вторник, среду и четверг ровно в 03:00 писал один и тот же участник — <b>Квартира 0</b>.', 'system');
            addMessage('Квартира 0', 'Добрый вечер, соседи.<br><br>Кто-нибудь не спит?');
            addMessage('', 'Никто ей не отвечал. Даже лайков не ставил.', 'system');
            addButton('Пролистать до сегодняшнего дня', scene5);
        }

        function scene5() {
            clearButtons();
            addMessage('', 'Сегодня пятница. Вы не спите. Ровно в 03:00 в общем чате появляется сообщение:', 'system');
            addMessage('Квартира 0', 'Артем у тебя свет в коридоре горит. Выключи, пожалуйста.');
            addMessage('', 'Вы оборачиваетесь. Свет в коридоре действительно горит.', 'system');
            
            addButton('Ответить: "Кто это?"', () => { scene6(true); });
            addButton('Промолчать (по правилам)', () => { scene6(false); }, 'btn-secondary');
        }

        function scene6(replied) {
            clearButtons();
            if (replied) {
                addMessage('Вы', 'Кто это?', 'out');
                addMessage('', '(Сообщение отправлено, но никто не ответил)', 'system');
            } else {
                addMessage('', '(Вы решили промолчать, как сказано в правилах)', 'system');
            }
            
            addMessage('', 'Проходит 4 минуты. В 03:04 Квартира 0 создает голосование в общем чате: <b>"Впустить нового жильца?"</b>. Варианты: "За" или "Против".', 'system');
            addMessage('', 'Весь дом спит, но голоса начинают появляться:<br>Кв. 5 — За.<br>Кв. 12 — За.<br>Кв. 31 — За.', 'system');
            
            addButton('Написать в чат: "Кто голосует?"', () => { scene7(true); });
            addButton('Подождать', () => { scene7(false); }, 'btn-secondary');
        }

        function scene7(wroteToChat) {
            clearButtons();
            if (wroteToChat) {
                addMessage('Вы', 'Кто голосует?', 'out');
                addMessage('', '(В общем чате тишина. Никто не отвечает)', 'system');
            }
            
            addMessage('', 'Вам приходит личное сообщение от Валентины Петровны.', 'system');
            addMessage('Валентина Петровна (ЛС)', 'Не пиши в общий чат. Если наберут половину — дверь не открывай. Кто бы не звонил.');
            addMessage('', 'Вы смотрите на голосование. <b>23 голоса</b>. До половины не хватает одного.', 'system');
            
            addButton('Прислушаться к тишине', scene8);
        }

        function scene8() {
            clearButtons();
            addMessage('', 'Внизу громко хлопает железная дверь подъезда. Лифт с грохотом поехал вверх.', 'system');
            addMessage('', '1 этаж... 2... 3... 4... 5.', 'system');
            addMessage('', 'Вы открываете голосование, чтобы посмотреть, кто нажал последним. Последний голос "За" был от <b>Квартиры 44</b>. От вашей квартиры.', 'system');
            addMessage('', '<span class="msg-danger">Хотя вы ничего не нажимали.</span>', 'system');
            
            addButton('Конец первой части', () => { 
                addMessage('', '<b>Продолжение следует...</b>', 'system');
                addButton('Начать заново', startGame, 'btn-danger');
            }, 'btn-danger');
        }

        // Запуск игры при загрузке
        window.onload = startGame;
    </script>
</body>
</html>
